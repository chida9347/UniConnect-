spring:
  datasource:
    url: jdbc:h2:mem:uniconnect_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-secret-key-with-more-than-32-characters
    expiration-ms: 3600000
  storage:
    type: local
    local-path: ${java.io.tmpdir}/uniconnect-test-uploads
  cors:
    allowed-origins: http://localhost:5173
  admin:
    email: ""
    password: ""
  frontend-url: http://localhost:5173

logging:
  level:
    root: WARN
    com.uniconnect: INFO
